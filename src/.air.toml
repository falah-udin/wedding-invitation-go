root = "."
tmp_dir = "tmp"

[build]
  cmd = "templ generate && go build -o ./tmp/main ./cmd/server"
  bin = "tmp/main"
  
  include_ext = ["go", "templ", "html", "css", "js"]
  exclude_dir = ["tmp", "vendor", "testdata", "node_modules", "public/storage"]
  exclude_regex = ["_test.go", "_templ.go"]
  
  delay = 500
  stop_on_error = true
  send_interrupt = false
  kill_delay = 0

[log]
  time = true
  main_only = false
  silent = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true