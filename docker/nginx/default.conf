server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    root /var/www/public;
    index index.html;

    # ==========================================
    # STATIC FILES - Langsung dari Nginx
    # ==========================================
    location /css/ {
        alias /var/www/public/css/;
        expires 7d;
        access_log off;
    }
    
    location /js/ {
        alias /var/www/public/js/;
        expires 7d;
        access_log off;
    }
    
    location /images/ {
        alias /var/www/public/images/;
        expires 30d;
        access_log off;
    }
    
    location /storage/ {
        alias /var/www/public/storage/;
        expires 30d;
        access_log off;
    }
    
    location = /favicon.ico {
        alias /var/www/public/favicon.ico;
        expires 30d;
        access_log off;
        log_not_found off;
    }

    # ==========================================
    # SEMUA REQUEST LAIN → Go App
    # ==========================================
    location / {
        proxy_pass         http://golang:8080;
        proxy_http_version 1.1;
        
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}